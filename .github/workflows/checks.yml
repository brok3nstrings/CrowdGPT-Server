name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Python files compile
        run: python -m py_compile server.py

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check server.py --select E,F,W --ignore E501